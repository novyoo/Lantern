<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Lantern</h1>
      <p>Rent a secure workspace, not just hardware.</p>
      {% if user %}
      <nav>
        <a href="/">Rentals</a>
        {% if user.role == "YRL Admin" %} &middot; <a href="/metrics">Reuse metrics</a>{% endif %}
        &middot; <a href="/account">{{ user.name }} ({{ user.role }})</a>
        &middot; <form method="post" action="/logout" style="display: inline;"><button type="submit" class="secondary outline" style="display: inline; width: auto; padding: 0.2rem 0.6rem;">Sign out</button></form>
      </nav>
      {% endif %}
    </header>
    {% block content %}{% endblock %}
  </main>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/ws.js"></script>
</body>
</html>
