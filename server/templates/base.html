<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern</title>
  <link rel="stylesheet" href="/static/lantern.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <h1>LANTERN</h1>
        <p class="tagline">Rent a secure workspace, not just hardware.</p>
      </div>
      {% if user %}
      <form method="post" action="/logout">
        <button type="submit" class="btn-signout">Sign out</button>
      </form>
      {% endif %}
    </header>

    {% if user %}
    <nav class="tabs">
      <a href="/" class="tab{% if request.url.path == '/' or request.url.path.startswith('/rentals') %} active{% endif %}">Rental</a>
      {% if user.role == "YRL Admin" %}
      <a href="/fleet" class="tab{% if request.url.path.startswith('/fleet') %} active{% endif %}">Fleet</a>
      <a href="/metrics" class="tab{% if request.url.path.startswith('/metrics') %} active{% endif %}">Reuse Metrics</a>
      {% endif %}
      <a href="/account" class="tab user-tab{% if request.url.path.startswith('/account') %} active{% endif %}">{{ user.name }} ({{ user.role }})</a>
    </nav>
    {% endif %}

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/ws.js"></script>
</body>
</html>
